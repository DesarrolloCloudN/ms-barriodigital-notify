spring.application.name=ms-barriodigital-notify
server.port=8083

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:barriodigital}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:barriodigital}

# Manual: los listeners confirman (ACK) o rechazan (NACK) explícitamente, nunca automático.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
